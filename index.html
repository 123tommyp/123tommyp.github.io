<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TommyP</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #000;
      color: #fff;
      font-family: Georgia, serif;
    }
    h1 {
      /* 2.75rem on wider screens; shrinks on phones so the line fits on one row. */
      font-size: min(2.75rem, 8vw);
      margin: 0 16px;
      text-align: center;
      font-weight: normal;
      letter-spacing: 0.05em;
    }
    /* Space for the ? is reserved from the start, so the text never moves. */
    .pop {
      display: inline-block;
      color: #ff1a1a;
      transform-origin: 50% 75%;
      animation: pop 0.8s ease-out 1s both;
    }
    /* Springs up, then wiggles side to side as it settles. */
    @keyframes pop {
      0%   { transform: scale(0)    rotate(0deg);   opacity: 0; }
      25%  { transform: scale(1.4)  rotate(0deg);   opacity: 1; }
      40%  { transform: scale(0.9)  rotate(-14deg); }
      55%  { transform: scale(1.05) rotate(10deg); }
      70%  { transform: scale(0.98) rotate(-6deg); }
      85%  { transform: scale(1)    rotate(3deg); }
      100% { transform: scale(1)    rotate(0deg);   opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pop { animation: appear 0.01s linear 1s both; }
      @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    }
  </style>
</head>
<body>
  <h1>TommyP, coming soon<span class="pop">?</span></h1>
</body>
</html>
